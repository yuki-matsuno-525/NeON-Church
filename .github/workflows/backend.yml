name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret-key-not-used-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # lint と format は他より速いので先に置く。壊れている入力を
      # テストやスキーマ生成に流しても時間の無駄になるため。
      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check
        run: mypy .

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest

      # --validate だけでは形式の妥当性しか見ず、「シリアライザを推測できない」
      # 等のエラーがあっても終了コード 0 で通ってしまう。--fail-on-warn を付けて
      # 初めて、スキーマの欠落がフロントの型に漏れる前に止められる。
      - name: Validate OpenAPI schema
        run: python manage.py spectacular --file schema.yaml --validate --fail-on-warn

      # schema.yaml はコミット済み。API の形が変わった PR では差分が本文に出るので、
      # レビューで「何が変わったか」を読める。生成し直したものと食い違ったら落とす。
      - name: Check committed schema is up to date
        run: git diff --exit-code -- schema.yaml

      - name: Django deploy security check (prod settings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-secret-key-must-be-50-chars-or-longer-to-pass-security-check
          DJANGO_ALLOWED_HOSTS: neon-church.com
          CSRF_TRUSTED_ORIGINS: https://neon-church.com
          CORS_ALLOWED_ORIGINS: https://neon-church.com
          POSTGRES_DB: neon
          POSTGRES_USER: neon
          POSTGRES_PASSWORD: neon
        # 本番設定でセキュリティ系チェック（HSTS / Secure Cookie / SSL Redirect 等）が通るかを確認する。
        # 本番環境変数の取り違えで保護が外れるリグレッションを CI で検出する目的。
        run: python manage.py check --deploy --tag security --fail-level WARNING
