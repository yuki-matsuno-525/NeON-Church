name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: neon_church_e2e
          POSTGRES_USER: neon_user
          POSTGRES_PASSWORD: neon_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_DEV_THROTTLE_RATE: 1000/min
      DJANGO_SECRET_KEY: ci-secret-key-for-e2e
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      POSTGRES_DB: neon_church_e2e
      POSTGRES_USER: neon_user
      POSTGRES_PASSWORD: neon_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      PLAYWRIGHT_API_BASE: http://localhost:8000

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # ── Backend ──────────────────────────────────────────────
      - name: Set up Python 3.13.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Migrate database
        working-directory: backend
        run: python manage.py migrate

      - name: Import gospel data
        working-directory: backend
        run: python manage.py import_gospel --path ../text

      - name: Start backend server
        working-directory: backend
        run: python manage.py runserver 0.0.0.0:8000 &

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz/ && break
            sleep 2
          done

      # ── Frontend ─────────────────────────────────────────────
      - name: Set up Node.js 22.23.1
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 開発サーバー（npm run dev）ではなく、本番と同じビルドで動かす。
      # 開発サーバーはページを「初めて開かれたとき」に組み立てるため、
      # 組み立てが終わる前に来たリクエストへ 404 を返す。テストは初めて開く
      # ページばかりなので、これが時々失敗する原因になっていた。
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend server
        working-directory: frontend
        run: npm run start &

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ && break
            sleep 2
          done

      # ── Playwright ───────────────────────────────────────────
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # retryは無効化している。初回失敗のtrace、画像、動画、
      # browser diagnosticsをここに残し、flakeもCI失敗として調査する。
      - name: Upload Playwright failure diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
