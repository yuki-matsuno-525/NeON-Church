name: Visual Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/all-features-bug-audit]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate reviewed Linux snapshot candidates as an artifact
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-fixed-seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: neon_church_visual
          POSTGRES_USER: neon_visual
          POSTGRES_PASSWORD: visual-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neon_visual -d neon_church_visual"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      CI: "true"
      VISUAL_CONTAINER: neon-church-visual-${{ github.run_id }}-${{ github.run_attempt }}
      VISUAL_IMAGE: neon-church-visual-runner:${{ github.sha }}
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_DEV_THROTTLE_RATE: 1000/min
      DJANGO_SECRET_KEY: visual-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      DJANGO_DEBUG: "True"
      DJANGO_REFERENCE_TIME: "2026-08-02T12:00:00+09:00"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      POSTGRES_DB: neon_church_visual
      POSTGRES_USER: neon_visual
      POSTGRES_PASSWORD: visual-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      PLAYWRIGHT_API_BASE: http://localhost:8000
      PLAYWRIGHT_VISUAL_BASELINE: "1"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate ephemeral visual-test credentials
        shell: bash
        run: |
          set -euo pipefail
          admin_password="$(openssl rand -hex 24)"
          user_password="$(openssl rand -hex 24)"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$user_password"
          echo "VISUAL_BASELINE_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "VISUAL_BASELINE_USER_PASSWORD=$user_password" >> "$GITHUB_ENV"

      - name: Build immutable visual runner
        shell: bash
        run: >-
          docker build
          --file frontend/Dockerfile.visual
          --tag "$VISUAL_IMAGE"
          frontend

      - name: Start isolated visual runner
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name "$VISUAL_CONTAINER" \
            --network host \
            --ipc=host \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env CI \
            --env DJANGO_SETTINGS_MODULE \
            --env DJANGO_DEV_THROTTLE_RATE \
            --env DJANGO_SECRET_KEY \
            --env DJANGO_DEBUG \
            --env DJANGO_REFERENCE_TIME \
            --env DJANGO_ALLOWED_HOSTS \
            --env CSRF_TRUSTED_ORIGINS \
            --env POSTGRES_DB \
            --env POSTGRES_USER \
            --env POSTGRES_PASSWORD \
            --env POSTGRES_HOST \
            --env POSTGRES_PORT \
            --env NEXT_PUBLIC_API_BASE_URL \
            --env PLAYWRIGHT_BASE_URL \
            --env PLAYWRIGHT_API_BASE \
            --env PLAYWRIGHT_VISUAL_BASELINE \
            --env VISUAL_BASELINE_ADMIN_PASSWORD \
            --env VISUAL_BASELINE_USER_PASSWORD \
            "$VISUAL_IMAGE" \
            sleep infinity

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          docker exec --workdir /work/backend "$VISUAL_CONTAINER" \
            python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
          docker exec --workdir /work/frontend "$VISUAL_CONTAINER" npm ci

      - name: Verify pinned runner versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker exec "$VISUAL_CONTAINER" python --version)" = "Python 3.13.15"
          test "$(docker exec "$VISUAL_CONTAINER" node --version)" = "v22.23.1"
          test "$(docker exec "$VISUAL_CONTAINER" npm --version)" = "10.9.8"
          test "$(docker exec --workdir /work/frontend "$VISUAL_CONTAINER" node -p \
            "require('@playwright/test/package.json').version")" = "1.59.1"
          test "$(docker exec --workdir /work/frontend "$VISUAL_CONTAINER" npx playwright --version)" \
            = "Version 1.59.1"
          browser_path="$(docker exec --workdir /work/frontend "$VISUAL_CONTAINER" node -e \
            "const { chromium } = require('@playwright/test'); process.stdout.write(chromium.executablePath())")"
          test "$(docker exec "$VISUAL_CONTAINER" "$browser_path" --version)" \
            = "Google Chrome for Testing 147.0.7727.15 "

      - name: Build fixed visual database
        shell: bash
        run: |
          set -euo pipefail
          docker exec --workdir /work/backend "$VISUAL_CONTAINER" python manage.py migrate
          docker exec --workdir /work/backend "$VISUAL_CONTAINER" \
            python manage.py import_gospel --path ../text
          docker exec --workdir /work/backend "$VISUAL_CONTAINER" \
            python manage.py seed_demo \
              --wipe \
              --scale small \
              --seed 42 \
              --reference-time "2026-08-02T12:00:00+09:00" \
              --admin-username visual_admin \
              --admin-password "$VISUAL_BASELINE_ADMIN_PASSWORD" \
              --user-password "$VISUAL_BASELINE_USER_PASSWORD" \
              > /dev/null

      - name: Start backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/visual-regression
          docker exec --detach --workdir /work/backend "$VISUAL_CONTAINER" \
            bash -lc "python manage.py runserver 0.0.0.0:8000 \
              > /work/artifacts/visual-regression/backend.log 2>&1"

      - name: Wait for backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/healthz/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/visual-regression/backend.log
          exit 1

      - name: Build frontend
        shell: bash
        run: docker exec --workdir /work/frontend "$VISUAL_CONTAINER" npm run build

      - name: Start frontend
        shell: bash
        run: >-
          docker exec --detach --workdir /work/frontend "$VISUAL_CONTAINER"
          bash -lc "npm run start -- --hostname 0.0.0.0
          > /work/artifacts/visual-regression/frontend.log 2>&1"

      - name: Wait for frontend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/visual-regression/frontend.log
          exit 1

      - name: Compare committed visual baselines
        id: compare
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.update_snapshots }}
        continue-on-error: true
        shell: bash
        run: >-
          docker exec
          --env PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report-visual-compare
          --workdir /work/frontend "$VISUAL_CONTAINER"
          npm run e2e:visual --
          --output=test-results-visual-compare

      - name: Verify comparison evidence is complete
        id: compare_integrity
        if: ${{ always() && steps.compare.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec --workdir /work/frontend "$VISUAL_CONTAINER" bash -lc '
            actual="$(mktemp)"
            find e2e/visual-baseline.spec.ts-snapshots -maxdepth 1 -type f -name "*.png" \
              -printf "%f\n" | LC_ALL=C sort > "$actual"
            diff -u e2e/visual-snapshot-manifest.txt "$actual"
            test "$(find test-results-visual-compare -type f -name "*.webm" | wc -l)" -eq 44
            find e2e/visual-baseline.spec.ts-snapshots test-results-visual-compare \
              -type f \( -name "*.png" -o -name "*.webm" \) -print0 \
              | sort -z | xargs -0 sha256sum \
              > /work/artifacts/visual-regression/comparison-evidence.sha256
          '

      - name: Generate Linux snapshot candidates
        id: candidates
        if: >-
          ${{ always() &&
              ((github.event_name == 'workflow_dispatch' && inputs.update_snapshots) ||
               steps.compare.outcome == 'failure') }}
        shell: bash
        run: >-
          docker exec
          --env PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report-visual-candidates
          --workdir /work/frontend "$VISUAL_CONTAINER"
          npm run e2e:visual:update --
          --output=test-results-visual-candidates

      - name: Verify candidate evidence is complete
        id: candidate_integrity
        if: ${{ always() && steps.candidates.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec --workdir /work/frontend "$VISUAL_CONTAINER" bash -lc '
            actual="$(mktemp)"
            find e2e/visual-baseline.spec.ts-snapshots -maxdepth 1 -type f -name "*.png" \
              -printf "%f\n" | LC_ALL=C sort > "$actual"
            diff -u e2e/visual-snapshot-manifest.txt "$actual"
            test "$(find test-results-visual-candidates -type f -name "*.webm" | wc -l)" -eq 44
            find e2e/visual-baseline.spec.ts-snapshots test-results-visual-candidates \
              -type f \( -name "*.png" -o -name "*.webm" \) -print0 \
              | sort -z | xargs -0 sha256sum \
              > /work/artifacts/visual-regression/candidate-evidence.sha256
          '

      - name: Prove major journeys pass ten consecutive times without retries
        id: release_smoke
        if: >-
          ${{ always() &&
              (steps.compare_integrity.outcome == 'success' ||
               steps.candidate_integrity.outcome == 'success') }}
        shell: bash
        run: >-
          docker exec
          --env PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report-release-smoke
          --workdir /work/frontend "$VISUAL_CONTAINER"
          npm run e2e --
          --grep "@release-smoke"
          --repeat-each=10
          --retries=0
          --project=chromium
          --output=test-results-release-smoke

      - name: Upload Linux snapshot candidates
        if: >-
          ${{ always() &&
              steps.candidate_integrity.outcome == 'success' &&
              steps.release_smoke.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: visual-snapshot-candidates-${{ github.sha }}
          path: |
            frontend/e2e/visual-baseline.spec.ts-snapshots/
            artifacts/visual-regression/candidate-evidence.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload repeated-journey report
        if: >-
          ${{ always() &&
              (steps.release_smoke.outcome == 'success' ||
               steps.release_smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-smoke-10x-${{ github.sha }}
          path: frontend/playwright-report-release-smoke/
          if-no-files-found: error
          retention-days: 14

      - name: Upload operation videos
        if: >-
          ${{ always() &&
              (steps.compare_integrity.outcome == 'success' ||
               steps.candidate_integrity.outcome == 'success') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: visual-operation-videos-${{ github.sha }}
          path: |
            frontend/test-results-visual-compare/**/*.webm
            frontend/test-results-visual-candidates/**/*.webm
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: ${{ failure() || steps.compare.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: visual-regression-diagnostics-${{ github.sha }}
          path: |
            frontend/playwright-report-visual-compare/
            frontend/playwright-report-visual-candidates/
            frontend/playwright-report-release-smoke/
            frontend/test-results-visual-compare/
            frontend/test-results-visual-candidates/
            frontend/test-results-release-smoke/
            artifacts/visual-regression/
          if-no-files-found: warn
          retention-days: 14

      # continue-on-error is used only so the first branch run can publish missing
      # Linux PNG candidates. The original comparison remains the release verdict.
      - name: Preserve comparison failure after artifact upload
        if: >-
          ${{ always() &&
              (steps.compare.outcome == 'failure' ||
               (github.event_name == 'workflow_dispatch' && inputs.update_snapshots)) }}
        shell: bash
        run: exit 1

      - name: Stop isolated visual runner
        if: always()
        shell: bash
        run: docker rm --force "$VISUAL_CONTAINER" || true
