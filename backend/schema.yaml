    get:
      operationId: api_references_read_retrieve
      description: |-
        GET /api/references/<slug>/read/<chapter>/?translation=口語訳

        読書画面が1章を表示するのに必要な「書・章・節」をまとめて1回で返す。

        以前フロントは books → chapters → verses と3回、しかも順番待ちで叩いていた。
        最初の1回は書の全一覧を落として目当ての1冊を探すだけだったので、章を開くたびに
        無駄な往復と転送が発生していた。ここで1回にまとめる。

        見つからないときは 404 に `code` を付けて、画面が「その訳にこの書が無い」のか
        「その章が無い」のかを言い分けられるようにする。
      parameters:
      - in: path
        name: chapter
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceReadResponse'
          description: ''
