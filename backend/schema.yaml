openapi: 3.0.3
info:
  title: NeON-Church API
  version: 0.1.0
  description: 聖書読書・コメントプラットフォーム NeON-Church の REST API
paths:
  /api/article-comments/{id}/:
    delete:
      operationId: api_article_comments_destroy
      description: DELETE /api/article-comments/{id}/   自分のコメントを消す（論理削除。返信の親を保つため）
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/article-tags/:
    get:
      operationId: api_article_tags_list
      description: GET /api/article-tags/   主題タグの一覧。記事が1件も無いタグは出さない。
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleTag'
          description: ''
  /api/articles/:
    get:
      operationId: api_articles_list
      description: |-
        GET  /api/articles/        記事一覧。既定は公開記事のみ。
                                   ?mine=true で自分の記事（下書き含む）、?tag=<slug> で主題、
                                   ?author=<ユーザー名> で書いた人で絞る。
                                   ?exclude_mine=true で自分の記事を公開一覧から除く。
        POST /api/articles/        記事を作る（要認証）
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleListList'
          description: ''
    post:
      operationId: api_articles_create
      description: |-
        GET  /api/articles/        記事一覧。既定は公開記事のみ。
                                   ?mine=true で自分の記事（下書き含む）、?tag=<slug> で主題、
                                   ?author=<ユーザー名> で書いた人で絞る。
                                   ?exclude_mine=true で自分の記事を公開一覧から除く。
        POST /api/articles/        記事を作る（要認証）
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleWrite'
          description: ''
  /api/articles/{id}/:
    get:
      operationId: api_articles_retrieve
      description: |-
        GET    /api/articles/{id}/   記事1件。下書き・限定公開は書いた人だけ。
        PATCH  /api/articles/{id}/   書き換え（書いた人だけ）
        DELETE /api/articles/{id}/   削除。コメントも一緒に消える（書いた人だけ）
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
          description: ''
    put:
      operationId: api_articles_update
      description: |-
        GET    /api/articles/{id}/   記事1件。下書き・限定公開は書いた人だけ。
        PATCH  /api/articles/{id}/   書き換え（書いた人だけ）
        DELETE /api/articles/{id}/   削除。コメントも一緒に消える（書いた人だけ）
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleWrite'
          description: ''
    patch:
      operationId: api_articles_partial_update
      description: |-
        GET    /api/articles/{id}/   記事1件。下書き・限定公開は書いた人だけ。
        PATCH  /api/articles/{id}/   書き換え（書いた人だけ）
        DELETE /api/articles/{id}/   削除。コメントも一緒に消える（書いた人だけ）
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArticleWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArticleWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArticleWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleWrite'
          description: ''
    delete:
      operationId: api_articles_destroy
      description: |-
        GET    /api/articles/{id}/   記事1件。下書き・限定公開は書いた人だけ。
        PATCH  /api/articles/{id}/   書き換え（書いた人だけ）
        DELETE /api/articles/{id}/   削除。コメントも一緒に消える（書いた人だけ）
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/articles/{id}/comments/:
    get:
      operationId: api_articles_comments_list
      description: |-
        GET  /api/articles/{id}/comments/   記事へのコメント（記事全体に対してのみ付く）
        POST /api/articles/{id}/comments/   コメントする（要認証）

        コメントは利用者が好きなだけ増やせるので、1回のリクエストで全件返さないようページングする。
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleCommentList'
          description: ''
    post:
      operationId: api_articles_comments_create
      description: |-
        GET  /api/articles/{id}/comments/   記事へのコメント（記事全体に対してのみ付く）
        POST /api/articles/{id}/comments/   コメントする（要認証）

        コメントは利用者が好きなだけ増やせるので、1回のリクエストで全件返さないようページングする。
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCommentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleCommentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleCommentRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleComment'
          description: ''
  /api/articles/citing/:
    get:
      operationId: api_articles_citing_list
      description: |-
        GET /api/articles/citing/?book=<書のslug>&chapter=<章>&verse=<節>

        その節を引用している公開記事。節のページの「引用した記事」タブで使う。
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleListList'
          description: ''
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      description: ログイン。username + password を検証し、成功したらトークンを Cookie にセットする。
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      description: |-
        ログアウト。Cookie の refresh_token をブラックリストに追加し、両方の Cookie を削除する。

        アクセストークン期限切れ時にもログアウトを成立させたいため AllowAny にしている。
        refresh_token が無ければ blacklist をスキップして Cookie 削除のみ行う。
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      description: GET /api/auth/me/  現在のログインユーザー情報を返す。PATCH でプロフィール更新。
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: api_auth_me_partial_update
      description: GET /api/auth/me/  現在のログインユーザー情報を返す。PATCH でプロフィール更新。
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/oauth/github/:
    get:
      operationId: api_auth_oauth_github_retrieve
      description: GET /api/auth/oauth/github/ → GitHub 認証ページへリダイレクト
      parameters:
      - in: query
        name: next
        schema:
          type: string
        description: 認証後に戻る相対パス。/ で始まらないものは無視する。
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '302':
          description: No response body
  /api/auth/oauth/github/callback/:
    get:
      operationId: api_auth_oauth_github_callback_retrieve
      description: GET /api/auth/oauth/github/callback/ → JWT Cookie 設定 → フロントへリダイレクト
      parameters:
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '302':
          description: No response body
  /api/auth/oauth/google/:
    get:
      operationId: api_auth_oauth_google_retrieve
      description: GET /api/auth/oauth/google/ → Google 認証ページへリダイレクト
      parameters:
      - in: query
        name: next
        schema:
          type: string
        description: 認証後に戻る相対パス。/ で始まらないものは無視する。
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '302':
          description: No response body
  /api/auth/oauth/google/callback/:
    get:
      operationId: api_auth_oauth_google_callback_retrieve
      description: GET /api/auth/oauth/google/callback/ → JWT Cookie 設定 → フロントへリダイレクト
      parameters:
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '302':
          description: No response body
  /api/auth/password-reset/:
    post:
      operationId: api_auth_password_reset_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/password-reset/confirm/:
    post:
      operationId: api_auth_password_reset_confirm_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/register/:
    post:
      operationId: api_auth_register_create
      description: |-
        ユーザー登録。
        成功するとトークンを HTTP-only Cookie にセットしてログイン状態で返す。
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/settings/:
    get:
      operationId: api_auth_settings_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSettings'
          description: ''
  /api/auth/settings/account/:
    delete:
      operationId: api_auth_settings_account_destroy
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/settings/identity/:
    patch:
      operationId: api_auth_settings_identity_partial_update
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedIdentityUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedIdentityUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedIdentityUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSettings'
          description: ''
  /api/auth/settings/password/:
    post:
      operationId: api_auth_settings_password_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/settings/preferences/:
    patch:
      operationId: api_auth_settings_preferences_partial_update
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPreferencesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPreferencesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPreferencesRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
          description: ''
  /api/auth/settings/sessions/:
    get:
      operationId: api_auth_settings_sessions_list
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
          description: ''
  /api/auth/settings/sessions/{jti}/:
    delete:
      operationId: api_auth_settings_sessions_destroy
      parameters:
      - in: path
        name: jti
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/settings/sessions/revoke-others/:
    post:
      operationId: api_auth_settings_sessions_revoke_others_create
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/token/refresh/:
    post:
      operationId: api_auth_token_refresh_create
      description: |-
        アクセストークンのリフレッシュ。
        Cookie の refresh_token を使い、新しいトークンペアを発行する（rotation あり）。
        古い refresh_token はブラックリストに追加される。
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/bookmarks/:
    get:
      operationId: api_bookmarks_list
      description: |-
        GET  /api/bookmarks/         自分のお気に入り一覧（要認証）
        GET  /api/bookmarks/?type=verse  種類で絞り込み（verse/chapter/book/comment/project）
        POST /api/bookmarks/         お気に入り追加（重複は 409）

        一覧レスポンスには通常の count/next/results に加えて counts を付ける。
        counts は絞り込み前の全種類の件数で、画面のタブに出す数字に使う。

        読書画面向けに箇所での絞り込みも受ける（`filters.filter_by_location` を参照）。
        GET /api/bookmarks/?book=<書のslug>              その書に付いたお気に入り
        GET /api/bookmarks/?book=<書のslug>&chapter=<章> その章と、その章の節に付いたお気に入り・コメントのお気に入り
        GET /api/bookmarks/?translation_project=<id>     その翻訳企画のお気に入り
        箇所で絞ったときは counts を付けない（画面のタブに使わないため、集計の往復を省く）。
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookmarkList'
          description: ''
    post:
      operationId: api_bookmarks_create
      description: |-
        GET  /api/bookmarks/         自分のお気に入り一覧（要認証）
        GET  /api/bookmarks/?type=verse  種類で絞り込み（verse/chapter/book/comment/project）
        POST /api/bookmarks/         お気に入り追加（重複は 409）

        一覧レスポンスには通常の count/next/results に加えて counts を付ける。
        counts は絞り込み前の全種類の件数で、画面のタブに出す数字に使う。

        読書画面向けに箇所での絞り込みも受ける（`filters.filter_by_location` を参照）。
        GET /api/bookmarks/?book=<書のslug>              その書に付いたお気に入り
        GET /api/bookmarks/?book=<書のslug>&chapter=<章> その章と、その章の節に付いたお気に入り・コメントのお気に入り
        GET /api/bookmarks/?translation_project=<id>     その翻訳企画のお気に入り
        箇所で絞ったときは counts を付けない（画面のタブに使わないため、集計の往復を省く）。
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookmarkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookmarkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookmarkRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
          description: ''
  /api/bookmarks/{id}/:
    delete:
      operationId: api_bookmarks_destroy
      description: DELETE /api/bookmarks/{pk}/  お気に入り削除（自分のもののみ）
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
