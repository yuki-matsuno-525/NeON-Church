[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test

# --strict-markers  存在しないマーカー名を書いたら落とす。
#                   typo した @pytest.mark.djangodb が黙って無視されるのを防ぐ。
# --strict-config   ini に未知のキーがあれば落とす。
# -ra               skip / xfail の理由をまとめて出す。
addopts = --strict-markers --strict-config -ra

# 遅いテストを探すとき: pytest --durations=10
# カバレッジを見るとき: pytest --cov （設定は pyproject.toml の [tool.coverage.*]）
